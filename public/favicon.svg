    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#shine)"/>

  <!-- S monogram -->
  <g transform="translate(-4 8) scale(0.92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 42 C80 26 42 24 42 46 C42 68 88 60 88 84 C88 106 48 104 38 88" stroke="#06316F" stroke-opacity="0.28" stroke-width="17" transform="translate(0 4)"/>
    <path d="M86 42 C80 26 42 24 42 46 C42 68 88 60 88 84 C88 106 48 104 38 88" stroke="url(#s)" stroke-width="16"/>
    <path d="M52 34 C60 30 72 31 78 38" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- big sparkle -->
  <circle cx="98" cy="30" r="24" fill="url(#glow)"/>
  <path d="M98 8 Q100 28 120 30 Q100 32 98 52 Q96 32 76 30 Q96 28 98 8 Z" fill="url(#spark)"/>

